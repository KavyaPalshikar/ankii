<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sorry ankii</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-glow page-glow-left"></div>
    <div class="page-glow page-glow-right"></div>
    <div class="texture"></div>
    <div class="floating-hearts" aria-hidden="true">
      <span>from MOTA</span>
      <span>with love</span>
      <span>for boondi</span>
      <span>one last smile</span>
      <span>always yours</span>
      <span>ankii</span>
    </div>
    <div class="heart-rain" id="heartRain" aria-hidden="true"></div>
    <div class="love-burst-layer" id="loveBurstLayer" aria-hidden="true"></div>

    <main class="subpage-main">
      <section class="signature-page reveal">
        <div class="signature-card">
          <div class="signature-glow"></div>
          <p class="signature-kicker">with all my heart</p>
          <h1>from MOTA</h1>
          <p class="signature-line">
            Every page before this was carrying one feeling to you. This last
            page carries my name with it.
          </p>
          <div class="signature-charms" aria-hidden="true">
            <span>❤</span>
            <span>🍣</span>
            <span>♥</span>
            <span>🍙</span>
          </div>
        </div>
      </section>
    </main>

    <div class="cursor" id="cursor"></div>
    <div class="cursor-text-layer" id="cursorTextLayer" aria-hidden="true"></div>
    <script src="script.js"></script>
  </body>
</html>
